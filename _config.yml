title: Your Name
description: Personal portfolio and projects
url: "https://konpaleo.github.io"
baseurl: "" # leave empty for user/organization site, use "/repo-name" for project site

# Build settings
markdown: kramdown
theme: minima # you can change this later
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Your original settings
lsi: false
safe: true
incremental: false
highlighter: rouge

gist:
  noscript: false

kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

# Navigation (optional)
header_pages:
  - index.md
  - projects.md
  - about.md

# Author info (optional but useful for SEO)
author:
  name: Your Name
  email: your-email@example.com

# Social links (optional)
github_username: your-username
linkedin_username: your-linkedin
