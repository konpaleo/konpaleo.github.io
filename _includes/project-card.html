<article class="project-card">
  <a class="project-image" href="{{ include.project.url }}" {% if include.project.url == '#' %}aria-label="{{ include.project.name }} placeholder link"{% endif %}>
    <img src="{{ include.project.image | relative_url }}" alt="{{ include.project.name }} preview">
  </a>
  <div class="project-card-body">
    <div class="tag-list">
      {% for tag in include.project.tags %}
        <span class="tag">{{ tag }}</span>
      {% endfor %}
    </div>
    <h3><a href="{{ include.project.url }}">{{ include.project.name }}</a></h3>
    <p>{{ include.project.description }}</p>
    <a class="text-link" href="{{ include.project.url }}">View project <span aria-hidden="true">&rarr;</span></a>
  </div>
</article>
