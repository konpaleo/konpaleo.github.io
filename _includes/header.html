<!-- Header -->
<header>
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <img class="img-responsive" src="img/profile.png" alt="profile-pic" />
        <div class="intro-text">
          <span class="name">{{ site.title }}</span>
          <span class="skills">{{ site.skills }}</span>
          <hr class="star-light" />
          <p class="description">{{ site.description }}</p>
        </div>
          <ul class="list-inline">
            {% for network in site.social %}
            <li>
              <a href="{{ network.url }}" class="btn-social btn-outline"><i
                  class="fa-brands fa-fw fa-{{ network.title }}"></i></a>
            </li>
            {% endfor %}
            <li>
              <a href="mailto:{{ site.email }}" class="btn-social btn-outline" aria-label="Email {{ site.email }}">
              <i class="fa-solid fa-fw fa-envelope" aria-hidden="true"></i>
            </a>
          </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</header>
