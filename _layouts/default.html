<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <div class="container navigation">
        <a class="site-name" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
        <nav aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="{{ '/projects/' | relative_url }}">Projects</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
        </nav>
      </div>
    </header>

    <main id="content" class="container">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container footer-content">
        <p>&copy; {{ 'now' | date: '%Y' }} {{ site.author.name }}. Built with Jekyll.</p>
        <a href="https://github.com/{{ site.repository }}">View source on GitHub</a>
      </div>
    </footer>
  </body>
</html>
